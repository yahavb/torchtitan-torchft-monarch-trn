# Monarch controller (qwen3_pretrain/controller.py), the brain: tells the 4 worker
# pods (workers.yaml) to train, watches each replica, and decides when one must
# restart (crash or hang). It marks that pod failed; the pod's liveness probe fails
# and Kubernetes restarts it; then the controller tells the new pod to train. CPU only.
# It owns the training processes, so if it dies, training stops: backoffLimit 0.
# Training arguments are the controller's args.
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen3-controller
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: qwen3-controller
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      # On a trn3-dev1 node only because the image (13.8 GB) is cached there.
      nodeSelector:
        node-type: trn3-dev1
      tolerations:
      - key: aws.amazon.com/neuron
        operator: Equal
        value: "true"
        effect: NoSchedule
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: controller
        image: 621547421844.dkr.ecr.us-west-2.amazonaws.com/torchft-neuron-m1@sha256:0e55895fd7717c415ce93aa824dd34084f1b16595e3f176292be6e8637319bfe
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          bash /opt/qwen3-pretrain/qwen3_pretrain/install_monarch.sh
          exec /opt/torch-neuronx/.venv/bin/python -m qwen3_pretrain.controller "$@"
        - controller
        # Training arguments, passed to every replica (~5.5 s/step: 5000 steps ~8 h).
        args: ["--training.steps", "5000"]
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NNODES
          value: "4"
        - name: WORKER_SERVICE
          value: qwen3-workers
        - name: MONARCH_WORKER_PORT
          value: "26600"
        # Keep qwen3_pretrain from loading the demo trainer (and torch) here.
        - name: QWEN3_CONTROLLER
          value: "1"
        - name: TORCH_DEVICE_BACKEND_AUTOLOAD
          value: "0"
        - name: PYTHONPATH
          value: /opt/qwen3-pretrain:/opt/torchft-neuron:/opt/torchtitan:/tmp/monarch-pkgs
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: HOME
          value: /tmp/home
        resources:
          requests:
            cpu: "2"
            memory: 8Gi
          limits:
            cpu: "4"
            memory: 16Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: code
          mountPath: /opt/qwen3-pretrain/qwen3_pretrain
          readOnly: true
        - name: scratch
          mountPath: /tmp
      volumes:
      - name: code
        configMap:
          name: qwen3-pretrain-code
      - name: scratch
        emptyDir:
          sizeLimit: 10Gi
