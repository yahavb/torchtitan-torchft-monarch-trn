# torchft lighthouse: the quorum coordinator. Each replica's rank 0 heartbeats here
# and asks, every step, which replicas are alive. It holds no training state.
# Same flags as the torchft demo: 4 replicas, keep training with 3. This repo's image
# (images/torch-neuronx-py312); the lighthouse program comes from torchft, built by
# the deps init container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-lighthouse
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen3-lighthouse
  template:
    metadata:
      labels:
        app: qwen3-lighthouse
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # torchft (with torchft_lighthouse), pinned, built into the deps volume
      # (qwen3_pretrain/build_deps.sh torchft, ~1 min).
      initContainers:
      - name: deps
        image: public.ecr.aws/e6d8z6l9/torch-neuronx-py312@sha256:c35c778cf6718e3256a37158d5242487713d7613aaf3192669bd6595ee1ca63e
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "/opt/qwen3-pretrain/qwen3_pretrain/build_deps.sh", "torchft"]
        env:
        - name: TORCHFT_REPO
          value: rpsilva-aws/torchft
        - name: TORCHFT_REF
          value: 5dda86759519
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-token
              key: GITHUB_TOKEN
        - name: DEPS
          value: /deps
        - name: HOME
          value: /tmp/home
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
          limits:
            cpu: "8"
            memory: 16Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: code
          mountPath: /opt/qwen3-pretrain/qwen3_pretrain
          readOnly: true
        - name: deps
          mountPath: /deps
        - name: build
          mountPath: /tmp
      containers:
      - name: lighthouse
        image: public.ecr.aws/e6d8z6l9/torch-neuronx-py312@sha256:c35c778cf6718e3256a37158d5242487713d7613aaf3192669bd6595ee1ca63e
        imagePullPolicy: IfNotPresent
        # The pod log is a summary (qwen3_pretrain/lighthouse_log.py): a line per
        # membership change and a steady line every 100 quorums, without the
        # per-request "New quorum not ready" chatter. Full raw log in the pod:
        #   kubectl exec deploy/qwen3-lighthouse -- cat /tmp/lighthouse/raw.log
        command:
        - /bin/bash
        - -c
        - |
          set -o pipefail
          FILTER=/opt/qwen3-pretrain/qwen3_pretrain/lighthouse_log.py
          # A missing filter (ConfigMap not updated) must not take the lighthouse down:
          # fall back to the plain log.
          if [ -f "$FILTER" ]; then SUMMARY=(/opt/py312/bin/python -u "$FILTER"); else SUMMARY=(cat); fi
          export PYTHONPATH="/deps/site${PYTHONPATH:+:$PYTHONPATH}"
          /deps/site/bin/torchft_lighthouse "$@" 2>&1 \
            | tee -a /tmp/lighthouse/raw.log \
            | "${SUMMARY[@]}"
        - lighthouse
        args:
        # Keep training with 3 of 4 replicas; wait for 4 at start.
        - --min_replicas
        - "3"
        - --initial_replicas
        - "4"
        - --quorum_tick_ms
        - "100"
        - --join_timeout_ms
        - "20000"
        - --bind
        - "[::]:29510"
        env:
        # No Neuron devices here: don't load torch_neuronx.
        - name: TORCH_DEVICE_BACKEND_AUTOLOAD
          value: "0"
        volumeMounts:
        - name: code
          mountPath: /opt/qwen3-pretrain/qwen3_pretrain
          readOnly: true
        - name: raw-log
          mountPath: /tmp/lighthouse
        - name: deps
          mountPath: /deps
          readOnly: true
        ports:
        - name: http
          containerPort: 29510
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 2
          failureThreshold: 30
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            cpu: "4"
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: code
        configMap:
          name: qwen3-pretrain-code
      - name: raw-log
        emptyDir:
          sizeLimit: 2Gi
      - name: deps
        emptyDir:
          sizeLimit: 2Gi
      - name: build
        emptyDir:
          sizeLimit: 10Gi
---
# Workers reach it at http://qwen3-lighthouse.default.svc.cluster.local:29510
apiVersion: v1
kind: Service
metadata:
  name: qwen3-lighthouse
  namespace: default
spec:
  selector:
    app: qwen3-lighthouse
  ports:
  - name: http
    port: 29510
    targetPort: http
