# Monarch version of job.yaml: four worker pods = four torchft replicas on one trn2.48xlarge.
# Same image, devices, env and readiness as job.yaml, but each pod runs only a
# Monarch worker and waits for controller.yaml's controller to tell it to train.
# The controller decides when a replica must restart and marks its pod failed; the
# liveness probe fails on that mark and Kubernetes restarts the pod.
# Headless Service at the end: the controller finds pod N at qwen3-workers-N.qwen3-workers.
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen3-workers
  namespace: default
spec:
  completionMode: Indexed
  completions: 4
  parallelism: 4
  # A dead worker pod is replaced; the controller re-attaches and torchft heals it.
  backoffLimit: 10000
  template:
    metadata:
      labels:
        app: qwen3-workers
    spec:
      subdomain: qwen3-workers
      restartPolicy: Never
      automountServiceAccountToken: false
      # The worker exits on SIGTERM at once (monarch_worker.py); 10 s is a backstop
      # so a restart the controller asked for is not held up by a slow shutdown.
      terminationGracePeriodSeconds: 10
      nodeSelector:
        node-type: trn3-dev1
      affinity:
        # Spread replicas over hosts, but allow two on one host: each pod is its own
        # world, so they share nothing on the host except EFA.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: qwen3-workers
              topologyKey: kubernetes.io/hostname
      tolerations:
      - key: aws.amazon.com/neuron
        operator: Equal
        value: "true"
        effect: NoSchedule
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      resourceClaims:
      - name: accelerators
        resourceClaimTemplateName: l-lnc2-trn-efa
      # Gate training on a quick matmul health check of this pod's own chips.
      # Runs in-process, so it sees only the devices allocated by the claim.
      initContainers:
      - name: neuron-healthcheck
        image: public.ecr.aws/neuron/neuron-observer:0.2.0
        command: ["sh", "-c"]
        args:
        - |
          ls /dev/neuron*
          neuron-observer health-check --test matmul
        env:
        - name: NEURON_RT_ALLOW_LEGACY_NEFF
          value: "1"
        resources:
          claims:
          - name: accelerators
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      # NIXL data plane (TORCHFT_NEURON_TRANSPORT=nixl): build NIXL once per node into
      # the node cache with lingbot-world-v2's tools/nixl/build_nixl.sh (ConfigMap
      # nixl-build), and lay torchft fork nixl-transport @ 4def5f3 (ProcessGroupNixl + nixl_link; ConfigMap
      # torchft-nixl) over the image's torchft. Root only for apt in build_nixl.sh.
      - name: nixl
        image: 621547421844.dkr.ecr.us-west-2.amazonaws.com/torchft-neuron-m1@sha256:49b1e734f8049167a780a60346952e32ea722c81433782a49762bc21c16cd1b9
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          export PATH="/opt/torch-neuronx/.venv/bin:$PATH" NIXL_CACHE=/node-cache/nixl
          eval "$(bash /opt/nixl-build/build_nixl.sh)"
          echo "nixl: $NIXL_PLUGIN_DIR"
          # hwloc is a runtime dependency; the non-root trainer cannot apt it.
          mkdir -p /node-cache/nixl/hwloc
          cp -a /usr/lib/x86_64-linux-gnu/libhwloc.so.15* /node-cache/nixl/hwloc/
          cp -a /usr/local/lib/python3.12/site-packages/torchft /overlay/
          cp -a /opt/torchft-neuron/examples /overlay/
          cd /overlay
          if command -v patch >/dev/null; then patch -p1 --forward < /opt/torchft-nixl/acaf137.patch
          else git apply -p1 /opt/torchft-nixl/acaf137.patch; fi
          echo "torchft overlay: nixl-transport 4def5f3 applied"
        volumeMounts:
        - {name: node-cache, mountPath: /node-cache}
        - {name: nixl-build, mountPath: /opt/nixl-build, readOnly: true}
        - {name: torchft-nixl, mountPath: /opt/torchft-nixl, readOnly: true}
        - {name: torchft-overlay, mountPath: /overlay}
      containers:
      - name: trainer
        # The torchft demo's worker image (Image 14). Used for its environment only:
        # torch-neuronx venv, TorchTitan 1ac46539 at /opt/torchtitan (the WORKDIR),
        # EFA/libfabric, and the Neuron attention adapter. torchft comes from the nixl overlay.
        # Proven on trn2; this is its first use on trn3-dev1.
        image: 621547421844.dkr.ecr.us-west-2.amazonaws.com/torchft-neuron-m1@sha256:49b1e734f8049167a780a60346952e32ea722c81433782a49762bc21c16cd1b9
        imagePullPolicy: IfNotPresent
        # TorchTitan resolves its test assets relative to its checkout.
        workingDir: /opt/torchtitan
        command:
        - /bin/bash
        - -c
        - |
          [ -f /opt/neuron-top-patch/neuron-monitor-top.py ] && install -m 755 /opt/neuron-top-patch/neuron-monitor-top.py "$(command -v neuron-monitor-top.py || echo /opt/aws/neuron/bin/neuron-monitor-top.py)" 2>/dev/null && echo "neuron-top: patched (preview)" || true   # neuron-top-patch: temporary, remove when the updated neuron-top ships in the Neuron SDK
          set -euo pipefail
          # This repo's code, the demo trainer and TorchTitan (in the image), Monarch
          # (installed next) and CloudWatch's boto3; the training processes Monarch
          # spawns inherit it.
          # NIXL (built by the nixl init container) and the torchft nixl-transport overlay.
          eval "$(NIXL_CACHE=/node-cache/nixl bash /opt/nixl-build/build_nixl.sh 2>/dev/null)"
          export LD_LIBRARY_PATH="/node-cache/nixl/hwloc:$LD_LIBRARY_PATH"
          export PYTHONPATH="/opt/torchft-overlay:/opt/qwen3-pretrain:/opt/torchft-neuron:/opt/torchtitan:/tmp/monarch-pkgs:/tmp/cw-pkgs${PYTHONPATH:+:$PYTHONPATH}"
          bash /opt/qwen3-pretrain/qwen3_pretrain/install_monarch.sh
          bash /opt/qwen3-pretrain/qwen3_pretrain/install_cloudwatch.sh || true
          bash /opt/qwen3-pretrain/qwen3_pretrain/fetch_tokenizer.sh
          echo "monarch worker for torchft replica ${JOB_COMPLETION_INDEX} of ${NNODES}"
          exec "$PY" -m qwen3_pretrain.monarch_worker
        env:
        # non-root container: the patch cannot replace /opt/aws/neuron/bin/neuron-monitor-top.py,
        # so put it first on PATH (kubectl exec sessions inherit this) # neuron-top-patch: temporary, remove when the updated neuron-top ships in the Neuron SDK
        - name: PATH
          value: "/opt/neuron-top-patch:/opt/aws/neuron/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/amazon/efa/bin:/home/.openmpi/bin"
        - name: PY
          value: /opt/torch-neuronx/.venv/bin/python
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: MONARCH_WORKER_PORT
          value: "26600"
        # torchft: where the lighthouse is (lighthouse.yaml's Service), and the
        # address this pod gives its peers.
        - name: TORCHFT_LIGHTHOUSE
          value: http://qwen3-lighthouse.default.svc.cluster.local:29510
        - name: TORCHFT_ADVERTISED_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        # torchft timeouts, as in the demo.
        - name: TORCHFT_TIMEOUT_SEC
          value: "120"
        # 1800 (demo: 600): replicas scheduled minutes apart must still meet in one quorum.
        - name: TORCHFT_QUORUM_TIMEOUT_SEC
          value: "1800"
        - name: TORCHFT_CONNECT_TIMEOUT_SEC
          value: "60"
        - name: TORCHFT_QUORUM_RETRIES
          value: "2"
        # The demo trainer's identity checks (examples/kubernetes/neuron_m1/trainer.py).
        # Must match config_registry: 4 replicas, quorum floor 3, 16 ranks per pod.
        - name: TORCHFT_NEURON_M1_RUN_ID
          value: torchft-neuron-qwen3-pretrain
        - name: TORCHFT_NEURON_M1_INITIAL_REPLICAS
          value: "4"
        - name: TORCHFT_NEURON_M1_MIN_REPLICAS
          value: "3"
        - name: TORCHFT_NEURON_TRANSPORT_STRIDE
          value: "16"
        - name: TORCHFT_NEURON_MAX_GENERATIONS
          value: "65536"
        # Cross-replica data plane: nixl (torchft/nixl.py) or neuron (native RDMA).
        - name: TORCHFT_NEURON_TRANSPORT
          value: nixl
        # NIXL arena sized for this run (default is 8 replicas, 1.34 GB per rank,
        # which ran a heal source out of device memory): 4 replicas, and a small
        # checkpoint slot (healing writes tensors directly; the slot is fallback only).
        - name: TORCHFT_NIXL_MAX_WORLD_SIZE
          value: "4"
        - name: TORCHFT_NIXL_CKPT_SLOT_BYTES
          value: "16777216"
        - name: TORCHFT_NEURON_M1_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: TORCHFT_NEURON_M1_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        # Pod count = number of torchft replicas (config_registry reads it).
        # Replica id = pod index; the controller passes it to the training processes.
        # Training metrics to CloudWatch (qwen3_pretrain/cloudwatch.py), sent by each
        # replica's rank 0 with the node's IAM role. Unset CW_NAMESPACE to turn off.
        - name: CW_NAMESPACE
          value: Qwen3/TorchFT
        - name: CW_RUN_ID
          value: qwen3-pretrain
        - name: AWS_REGION
          value: us-east-2
        - name: AWS_DEFAULT_REGION
          value: us-east-2
        # Training data: C4 streamed from Hugging Face (QWEN3_DATASET=c4_test for the
        # tiny in-image sample). The pods need internet access to huggingface.co. An
        # HF token is optional and only avoids anonymous rate limits:
        #   kubectl create secret generic hf-token --from-literal=HF_TOKEN=<token>
        - name: QWEN3_DATASET
          value: c4
        - name: HF_HOME
          value: /tmp/hf-cache
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
              optional: true
        - name: NNODES
          value: "4"
        # A GRADSYNC line every N steps: the same rank in each pod must match.
        - name: GRADSYNC_LOG_EVERY
          value: "10"
        # One rank per logical NeuronCore: 4 devices x 8 cores / LNC 2 = 16.
        # NEURON_RT_VISIBLE_CORES is deliberately unset: the DRA claim decides which
        # cores the container sees, and torch-neuronx pins each rank to its own.
        - name: NEURON_LOGICAL_NC_CONFIG
          value: "2"
        # Off: Monarch imports torch in each training process before its rank is set.
        # Each process imports torch_neuronx itself once it has its rank
        # (replica_actor.py), which registers the "neuron" compile backend.
        - name: TORCH_DEVICE_BACKEND_AUTOLOAD
          value: "0"
        # Import the demo trainer (and TorchTitan) only after torch_neuronx is loaded:
        # TorchTitan picks its device type at import (qwen3_pretrain/__init__.py).
        - name: QWEN3_DEFER_M1_SHAPE
          value: "1"
        # Where the demo trainer and TorchTitan are (replica_actor.py puts them first).
        - name: QWEN3_DEPS_PATHS
          value: /opt/torchft-overlay:/opt/torchft-neuron:/opt/torchtitan
        # 256 MiB allocator split cap: the demo's fix for device-memory growth.
        - name: TORCH_NEURONX_SEGMENT_ALLOCATOR_CONFIG
          value: kMaxSplitSizeBytes=268435456
        - name: TORCH_NEURONX_LOG_LEVEL
          value: "2"
        # Cross-node collectives over EFA.
        - name: FI_PROVIDER
          value: efa
        - name: FI_EFA_USE_DEVICE_RDMA
          value: "1"
        - name: FI_EFA_FORK_SAFE
          value: "1"
        - name: FI_EFA_ENABLE_SHM_TRANSFER
          value: "0"
        - name: CCOM_SOCKET_IFNAME
          value: eth0
        - name: OMP_NUM_THREADS
          value: "1"
        - name: MKL_NUM_THREADS
          value: "1"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: HOME
          value: /tmp/home
        # Startup: the Monarch worker is listening (it installs Monarch first, a few
        # seconds). Liveness is the controller's decision: it fails once the controller
        # marks this pod failed (a crashed or hung replica), and Kubernetes restarts the
        # pod. Readiness is per pod, as in job.yaml: ready while THIS replica keeps
        # finishing steps; not ready while it compiles or heals, or once marked failed.
        startupProbe:
          tcpSocket:
            port: monarch
          periodSeconds: 2
          failureThreshold: 150
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "test ! -e /run/torchft-neuron-m1/qwen3-failed"]
          periodSeconds: 5
          failureThreshold: 2
        readinessProbe:
          exec:
            # Per-pod: ready while THIS replica keeps finishing steps (readiness.py).
            command: ["/opt/torch-neuronx/.venv/bin/python", "/opt/qwen3-pretrain/qwen3_pretrain/readiness.py"]
          periodSeconds: 5
          failureThreshold: 2
          timeoutSeconds: 10
        ports:
        - name: monarch
          containerPort: 26600
        resources:
          claims:
          - name: accelerators
          # Proportional to the claim: 4 of the node's 16 Neuron devices = 1/4 of its
          # allocatable (trn2: 191450m CPU, 1998Gi memory, 1798Gi ephemeral),
          # rounded down.
          requests:
            cpu: "47"
            memory: 489Gi
            ephemeral-storage: 440Gi
          limits:
            cpu: "47"
            memory: 489Gi
            ephemeral-storage: 440Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - {name: neuron-top-patch, mountPath: /opt/neuron-top-patch, readOnly: true}   # neuron-top-patch
        - name: code
          mountPath: /opt/qwen3-pretrain/qwen3_pretrain
          readOnly: true
        # The demo trainer writes its per-step status (frontier.py) here; the
        # demo mounts the same emptyDir.
        - name: runtime
          mountPath: /run/torchft-neuron-m1
        # torch-neuronx keeps its NEFF/HLO compile caches under /tmp by default.
        - name: scratch
          mountPath: /tmp
        - name: dev-shm
          mountPath: /dev/shm
        - {name: node-cache, mountPath: /node-cache, readOnly: true}
        - {name: nixl-build, mountPath: /opt/nixl-build, readOnly: true}
        - {name: torchft-overlay, mountPath: /opt/torchft-overlay, readOnly: true}
      volumes:
      - name: neuron-top-patch   # neuron-top-patch: temporary, remove when the updated neuron-top ships in the Neuron SDK
        configMap: {name: neuron-top-patch, optional: true, defaultMode: 0755}
      - name: code
        configMap:
          name: qwen3-pretrain-code
      - name: runtime
        emptyDir: {}
      - name: scratch
        emptyDir:
          sizeLimit: 400Gi
      - name: dev-shm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
      - name: node-cache
        hostPath: {path: /opt/torchft-nixl-cache, type: DirectoryOrCreate}
      - name: nixl-build
        configMap: {name: nixl-build}
      - name: torchft-nixl
        configMap: {name: torchft-nixl}
      - name: torchft-overlay
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-workers
  namespace: default
spec:
  clusterIP: None
  # The controller attaches before the pods are ready (they become ready by training).
  publishNotReadyAddresses: true
  selector:
    app: qwen3-workers
  ports:
  - name: monarch
    port: 26600
